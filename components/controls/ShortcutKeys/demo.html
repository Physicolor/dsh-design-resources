<!-- 几何取自同目录 shortcut-keys.module.css（即产品采集值）；token 取自 website/css/dsh-tokens.css。
     键帽对读屏是装饰（容器 aria-hidden），键位本身写在按钮的 aria-keyshortcuts 上。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortcutKeys · DSH 设计资源</title>
<style>
:root {
  --dsw-static-neutral-bluish-00: #fff;
  --dsw-static-neutral-bluish-50: #f9fafb;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-850: #2c2c2e;
  --dsw-static-neutral-bluish-1000: #0f1115;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-border-l1: light-dark(#0000000a, #ffffff0f);
  --dsw-alias-border-l2: light-dark(#0000001a, #ffffff1f);
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300, #cfd3d6));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
  --dsw-alias-tooltip-bg: light-dark(var(--dsw-static-neutral-bluish-850), var(--dsw-static-neutral-bluish-850));
  --dsw-alias-tooltip-key-bg: color-mix(in srgb, var(--dsw-alias-tooltip-bg), white 18%);
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* --------------------------------------------------- 组件几何
   数值逐条取自同目录 shortcut-keys.module.css（CSS Modules 的哈希类名已去掉），
   规则重新组织过，声明值未改。 */
.keys { display: inline-flex; flex: none; align-items: center; gap: 3px; color: var(--dsw-alias-label-tertiary); font-size: 12px; line-height: 16px; white-space: nowrap; }
.key { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font: inherit; }
.separator { font: inherit; }
.tooltip { color: inherit; gap: 2px; font-size: 11px; line-height: 14px; }
.tooltip .key { min-width: 16px; height: 16px; padding: 0 2px; border: 0; border-radius: 4px; background: var(--dsw-alias-tooltip-key-bg); }
.joined { box-sizing: border-box; height: 16px; padding: 0 4px; border-radius: 4px; background: var(--dsw-alias-tooltip-key-bg); }
.joined .key { min-width: 0; height: auto; padding: 0; border: 0; background: transparent; }

/* ------------------------------------------------------------------ demo 外壳
   body 只给 16px 内边距与文字颜色，不设背景：底色由站点（shadow host）提供。
   .demo-label 只写客观事实（尺寸 / 出处）。 */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label { margin: 0 0 8px; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-tertiary); }
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; align-items: center; gap: 16px; }

/* 左栏新会话按钮的实测排布：252 × 38、圆角 12、行尾键帽平时透明，hover / focus 才出现。 */
.newSession {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 252px;
  height: 38px;
  padding: 8px 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 12px;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font: inherit;
  cursor: pointer;
}
.newSession__keys { margin-left: auto; opacity: 0; pointer-events: none; transition: opacity 120ms cubic-bezier(0.4, 0, 0.2, 1); }
.newSession:hover .newSession__keys,
.newSession:focus-visible .newSession__keys { opacity: 1; }

/* 工具提示样例：产品里键帽形态出现在气泡里，底色是 tooltip 底。 */
.tip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--dsw-alias-tooltip-bg);
  color: #fff;
  font-size: 11px;
  line-height: 14px;
}
</style>
</head>
<body>
  <div class="demo-group">
    <p class="demo-label">平排（默认）· gap 3 · 12/16 · 无底色无圆角 —— 采集：键帽 19 × 16、bg 透明、radius 0</p>
    <span class="keys" aria-hidden="true"><kbd class="key">Ctrl</kbd><kbd class="separator">+</kbd><kbd class="key">Alt</kbd><kbd class="separator">+</kbd><kbd class="key">N</kbd></span>
  </div>

  <div class="demo-group">
    <p class="demo-label">提示气泡 · 11/14 · 每枚键 min-width 16 / height 16 / padding 0 2 / 圆角 4 / 底 --dsw-alias-tooltip-key-bg</p>
    <span class="tip">搜索会话<span class="keys tooltip" aria-hidden="true"><kbd class="key">Ctrl</kbd><kbd class="separator">+</kbd><kbd class="key">K</kbd></span></span>
  </div>

  <div class="demo-group">
    <p class="demo-label">连排 · height 16 / padding 0 4 / 圆角 4，内部键不带底</p>
    <span class="joined" aria-hidden="true"><span class="keys" style="color:inherit"><kbd class="key">Ctrl</kbd><kbd class="separator">+</kbd><kbd class="key">K</kbd></span></span>
  </div>

  <div class="demo-group">
    <p class="demo-label">长在哪儿 · 左栏新会话按钮（252 × 38、圆角 12；键帽平时 opacity 0，悬停或键盘聚焦才出现）</p>
    <button type="button" class="newSession" aria-keyshortcuts="Control+Alt+N">
      新会话
      <span class="newSession__keys"><span class="keys" aria-hidden="true"><kbd class="key">Ctrl</kbd><kbd class="separator">+</kbd><kbd class="key">Alt</kbd><kbd class="separator">+</kbd><kbd class="key">N</kbd></span></span>
    </button>
  </div>
</body>
</html>
