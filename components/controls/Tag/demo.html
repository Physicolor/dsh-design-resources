<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag · DSH Design Resources</title>
<style>
:root {
  --dsw-static-neutral-bluish-00: #fff;
  --dsw-static-neutral-bluish-50: #f9fafb;
  --dsw-static-neutral-bluish-60: #f9fafb;
  --dsw-static-neutral-bluish-75: #f1f3f5;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-150: #e9ecf2;
  --dsw-static-neutral-bluish-200: #e1e5ee;
  --dsw-static-neutral-bluish-300: #cfd3d6;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-500: #979da6;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-750: #43454a;
  --dsw-static-neutral-bluish-800: #353638;
  --dsw-static-neutral-bluish-850: #2c2c2e;
  --dsw-static-neutral-bluish-875: #232324;
  --dsw-static-neutral-bluish-900: #1b1b1c;
  --dsw-static-neutral-bluish-950: #151517;
  --dsw-static-neutral-bluish-1000: #0f1115;
  --dsw-static-neutral-50: #fafafa;
  --dsw-static-neutral-200: #e5e5e5;
  --dsw-static-neutral-300: #d4d4d4;
  --dsw-static-deepseek-100: #e4edfd;
  --dsw-static-deepseek-400: #7aaaff;
  --dsw-static-deepseek-450: #5686fe;
  --dsw-static-deepseek-500: #4176e6;
  --dsw-static-deepseek-800: #34415b;
  --dsw-static-green-100: #e6faed;
  --dsw-static-green-400: #4ed17e;
  --dsw-static-green-500: #22c55e;
  --dsw-static-green-900: #233c2c;
  --dsw-static-amber-100: #fef5e7;
  --dsw-static-amber-400: #f7ad31;
  --dsw-static-amber-500: #f59e0b;
  --dsw-static-amber-600: #dd8629;
  --dsw-static-amber-900: #27241f;
  --dsw-static-red-100: #fee2e2;
  --dsw-static-red-400: #f25a5a;
  --dsw-static-red-600: #ec1313;
  --dsw-static-blue-500: #3b82f6;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-mask-1: #0000003d;
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-bg-skeleton: #0000000a;
  --dsw-alias-border-l1: #0000000a;
  --dsw-alias-border-l2: #0000001a;
  --dsw-alias-border-l3: #0000001f;
  --dsw-alias-border-l4: #00000029;
  --dsw-alias-brand-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-button-contrast-fill: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-button-elevated-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-hover: var(--dsw-static-neutral-bluish-75);
  --dsw-alias-button-ghost-active-border: var(--dsw-static-neutral-bluish-500);
  --dsw-alias-button-ghost-active-fill: var(--dsw-static-neutral-bluish-100);
  --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary);
  --dsw-alias-button-primary-hover: var(--dsw-static-neutral-bluish-750);
  --dsw-alias-button-tool-bar-fill: #54555780;
  --dsw-alias-button-tool-bar-hover: #54555799;
  --dsw-alias-interactive-bg-active: #2631481a;
  --dsw-alias-interactive-bg-hover: #2631480f;
  --dsw-alias-interactive-bg-hover-danger: #ec13130d;
  --dsw-alias-label-caption: var(--dsw-static-neutral-bluish-400);
  --dsw-alias-label-dimmed: var(--dsw-static-neutral-bluish-200);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-primary-inverted: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-600);
  --dsw-alias-link: var(--dsw-static-deepseek-500);
  --dsw-alias-markdown-code-block: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-code-block-banner: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-inline-code: var(--dsw-static-neutral-50);
  --dsw-alias-scrollbar-bg-l2: var(--dsw-static-neutral-200);
  --dsw-alias-scrollbar-hover-l2: var(--dsw-static-neutral-300);
  --dsw-alias-specific-menu: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-specific-sidebar-fill: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-state-business-primary: var(--dsw-static-deepseek-500);
  --dsw-alias-state-error-primary: var(--dsw-static-red-600);
  --dsw-alias-state-success-primary: var(--dsw-static-green-500);
  --dsw-alias-state-success-tertiary: var(--dsw-static-green-100);
  --dsw-alias-state-warn-label: var(--dsw-static-amber-600);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-100);
  --dsw-alias-tooltip-bg: var(--dsw-static-neutral-bluish-850);
  --dsw-specific-menu: var(--dsw-static-neutral-bluish-50);

  --dsw-elevation-stroke-color: var(--dsw-alias-border-l1);
  --dsw-elevation-stroke: 0 0 0 .5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, .04), 0 0 20px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv1: 0 2px 4px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, .02), 0 2px 8px 0 rgba(0, 0, 0, .04);
  --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, .2), 0 0 4px 0 rgba(0, 0, 0, .02), 0 12px 32px 0 rgba(0, 0, 0, .08);
  --dsw-mask-blur: none;
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  /* The product declares these two as font-shorthand composite tokens; they are expanded here
     so the demo can use each one on its own. */
  --dsw-font-s-14: 14px/22px var(--dsw-font-family);
  --dsw-font-xs-13: 13px/20px var(--dsw-font-family);
}

/* Dark theme: the site hangs its dark tokens on body[data-ds-dark-theme], which a shadow DOM
   cannot select, and :host custom properties would override the inherited values — so the dark
   values are carried in this file and chosen with light-dark() from the color-scheme the host
   inherits. Only tokens this page uses whose light and dark values differ are listed; every
   value comes from website/css/dsh-tokens.css. */
:root {
  --dsw-alias-bg-layer-3: light-dark(var(--dsw-static-neutral-bluish-00), var(--dsw-static-neutral-bluish-800));
  --dsw-alias-bg-module-platform: light-dark(var(--dsw-static-neutral-bluish-60), var(--dsw-static-neutral-bluish-800));
  --dsw-alias-border-l4: light-dark(#00000029, #fff3);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
  --dsw-alias-state-business-primary: light-dark(var(--dsw-static-deepseek-500), var(--dsw-static-deepseek-400));
  --dsw-alias-state-error-primary: light-dark(var(--dsw-static-red-600), var(--dsw-static-red-400));
}

/* --------------------------------------------------- component geometry
   Every value comes from tag.module.css in this directory (the CSS Modules hashed class
   names are dropped); the rules are reorganised, the declared values are unchanged. */
.tag {
  --dsh-tag-radius: 999px;
  --dsh-tag-pad-y: 1px;
  --dsh-tag-pad-x: 8px;
  --dsh-tag-font-size: 11px;
  --dsh-tag-line-height: 17px;
  --dsh-tag-font-weight: 500;

  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  padding: var(--dsh-tag-pad-y) var(--dsh-tag-pad-x);
  border-radius: var(--dsh-tag-radius);
  corner-shape: round;
  font-family: inherit;
  font-size: var(--dsh-tag-font-size);
  line-height: var(--dsh-tag-line-height);
  font-weight: var(--dsh-tag-font-weight);
  white-space: nowrap;
}

.tag[data-tone='outline'] { border: 0.5px solid var(--dsw-alias-border-l4); color: var(--dsw-alias-label-tertiary); }
.tag[data-tone='solid'] { background: var(--dsw-alias-label-primary); color: var(--dsw-alias-bg-layer-3); }
.tag[data-tone='neutral'] { background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); }
.tag[data-tone='quiet'] { color: var(--dsw-alias-label-tertiary); }

.tag[data-tone='success'] {
  background: color-mix(in srgb, var(--dsw-alias-state-success-primary) 10%, transparent);
  color: var(--dsw-alias-state-success-primary);
}

.tag[data-tone='info'] {
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 10%, transparent);
  color: var(--dsw-alias-state-business-primary);
}

.tag[data-tone='warning'] {
  background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 12%, transparent);
  color: var(--dsw-alias-state-warn-primary);
}

.tag[data-tone='danger'] {
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 10%, transparent);
  color: var(--dsw-alias-state-error-primary);
}

/* ------------------------------------------------------------------ demo shell
   body sets only the 16px padding and the text colour, never a background: the site (the shadow
   host) supplies that. .demo-label is the only text this page allows, and it states facts only
   (sizes and state names). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}

.plugin-line { display: flex; align-items: center; gap: 6px; }
.plugin-line .plugin-name { font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-primary); }
.hero-line { display: flex; align-items: center; gap: 8px; }
.hero-line .hero-title { font-size: 26px; line-height: 34px; font-weight: 600; color: var(--dsw-alias-label-primary); }
</style>
</head>
<body>
<!-- The two tags that appear in the captures are the same tone (info); the other tones have no
     capture behind them. -->

  <div class="demo-group">
    <p class="demo-label" data-t="demo.tag.pluginRowLabel">06-plugins · 官方分组行 · 插件名之后 · tone=info（实拍 42×18）</p>
    <div class="demo-stack" style="gap:12px">
      <div class="plugin-line"><span class="plugin-name" data-capture="plugin list row, plugin name, 06-plugins capture">智能体团队</span><span class="tag" data-tone="info" data-capture="plugin list row, experimental tag, 06-plugins capture">实验性</span></div>
      <div class="plugin-line"><span class="plugin-name" data-capture="plugin list row, plugin name, 06-plugins capture">自动授权审查</span><span class="tag" data-tone="info" data-capture="plugin list row, experimental tag, 06-plugins capture">实验性</span></div>
      <div class="plugin-line"><span class="plugin-name" data-capture="plugin list row, plugin name, 06-plugins capture">语音输入</span><span class="tag" data-tone="info" data-capture="plugin list row, experimental tag, 06-plugins capture">实验性</span></div>
    </div>
  </div>

  <div class="demo-group">
    <p class="demo-label" data-t="demo.tag.heroRowLabel">01-hero · Hero 标语之后 · tone=info（实拍 50×19）</p>
    <div class="hero-line">
      <span class="hero-title" data-capture="hero slogan, 01-hero capture">探索未至之境</span>
      <span class="tag" data-tone="info" data-capture="hero tag, 01-hero capture">预览版</span>
    </div>
  </div>

  <div class="demo-group">
    <p class="demo-label" data-t="demo.tag.uncapturedTones">截图未覆盖 · outline / solid / neutral / quiet / success / warning / danger —— 几何同一，只有配色不同</p>
    <div class="demo-row" style="gap:6px">
      <span class="tag" data-tone="outline" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="solid" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="neutral" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="quiet" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="success" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="warning" data-t="demo.tag.sample">示例</span>
      <span class="tag" data-tone="danger" data-t="demo.tag.sample">示例</span>
    </div>
  </div>
</body>
</html>
