<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button 按钮 · DSH 设计资源</title>
<style>
/* ---------------------------------------------------------------------------
   演示用 token 脚手架。
   数值逐条取自本仓库 website/css/dsh-tokens.css（由产品主题采集生成）与
   app.asar 内官方主题对合成 token（elevation / shadow / font）的定义。
   真实 DSH 运行时由宿主主题注入这些变量；demo 只是把同一批值内联进来，
   组件类本身不写死任何颜色。
   --------------------------------------------------------------------------- */
:root {
  --dsw-static-neutral-bluish-00: #fff;
  --dsw-static-neutral-bluish-50: #f9fafb;
  --dsw-static-neutral-bluish-60: #f9fafb;
  --dsw-static-neutral-bluish-75: #f1f3f5;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-150: #e9ecf2;
  --dsw-static-neutral-bluish-200: #e1e5ee;
  --dsw-static-neutral-bluish-300: #cfd3d6;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-500: #979da6;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-750: #43454a;
  --dsw-static-neutral-bluish-800: #353638;
  --dsw-static-neutral-bluish-850: #2c2c2e;
  --dsw-static-neutral-bluish-875: #232324;
  --dsw-static-neutral-bluish-900: #1b1b1c;
  --dsw-static-neutral-bluish-950: #151517;
  --dsw-static-neutral-bluish-1000: #0f1115;
  --dsw-static-neutral-50: #fafafa;
  --dsw-static-neutral-200: #e5e5e5;
  --dsw-static-neutral-300: #d4d4d4;
  --dsw-static-deepseek-100: #e4edfd;
  --dsw-static-deepseek-400: #7aaaff;
  --dsw-static-deepseek-450: #5686fe;
  --dsw-static-deepseek-500: #4176e6;
  --dsw-static-deepseek-800: #34415b;
  --dsw-static-green-100: #e6faed;
  --dsw-static-green-400: #4ed17e;
  --dsw-static-green-500: #22c55e;
  --dsw-static-green-900: #233c2c;
  --dsw-static-amber-100: #fef5e7;
  --dsw-static-amber-400: #f7ad31;
  --dsw-static-amber-500: #f59e0b;
  --dsw-static-amber-600: #dd8629;
  --dsw-static-amber-900: #27241f;
  --dsw-static-red-100: #fee2e2;
  --dsw-static-red-400: #f25a5a;
  --dsw-static-red-600: #ec1313;
  --dsw-static-blue-500: #3b82f6;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-mask-1: #0000003d;
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-bg-skeleton: #0000000a;
  --dsw-alias-border-l1: #0000000a;
  --dsw-alias-border-l2: #0000001a;
  --dsw-alias-border-l3: #0000001f;
  --dsw-alias-border-l4: #00000029;
  --dsw-alias-brand-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-button-contrast-fill: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-button-elevated-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-hover: var(--dsw-static-neutral-bluish-75);
  --dsw-alias-button-ghost-active-border: var(--dsw-static-neutral-bluish-500);
  --dsw-alias-button-ghost-active-fill: var(--dsw-static-neutral-bluish-100);
  --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary);
  --dsw-alias-button-primary-hover: var(--dsw-static-neutral-bluish-750);
  --dsw-alias-button-tool-bar-fill: #54555780;
  --dsw-alias-button-tool-bar-hover: #54555799;
  --dsw-alias-interactive-bg-active: #2631481a;
  --dsw-alias-interactive-bg-hover: #2631480f;
  --dsw-alias-interactive-bg-hover-danger: #ec13130d;
  --dsw-alias-label-caption: var(--dsw-static-neutral-bluish-400);
  --dsw-alias-label-dimmed: var(--dsw-static-neutral-bluish-200);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-primary-inverted: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-600);
  --dsw-alias-link: var(--dsw-static-deepseek-500);
  --dsw-alias-markdown-code-block: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-code-block-banner: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-inline-code: var(--dsw-static-neutral-50);
  --dsw-alias-scrollbar-bg-l2: var(--dsw-static-neutral-200);
  --dsw-alias-scrollbar-hover-l2: var(--dsw-static-neutral-300);
  --dsw-alias-specific-menu: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-specific-sidebar-fill: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-state-business-primary: var(--dsw-static-deepseek-500);
  --dsw-alias-state-error-primary: var(--dsw-static-red-600);
  --dsw-alias-state-success-primary: var(--dsw-static-green-500);
  --dsw-alias-state-success-tertiary: var(--dsw-static-green-100);
  --dsw-alias-state-warn-label: var(--dsw-static-amber-600);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-100);
  --dsw-alias-tooltip-bg: var(--dsw-static-neutral-bluish-850);
  --dsw-specific-menu: var(--dsw-static-neutral-bluish-50);

  --dsw-elevation-stroke-color: var(--dsw-alias-border-l1);
  --dsw-elevation-stroke: 0 0 0 .5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, .04), 0 0 20px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv1: 0 2px 4px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, .02), 0 2px 8px 0 rgba(0, 0, 0, .04);
  --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, .2), 0 0 4px 0 rgba(0, 0, 0, .02), 0 12px 32px 0 rgba(0, 0, 0, .08);
  --dsw-mask-blur: none;
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  /* 官方把这两条写成 font 简写合成 token，这里展开以便 demo 单条使用。 */
  --dsw-font-s-14: 14px/22px var(--dsw-font-family);
  --dsw-font-xs-13: 13px/20px var(--dsw-font-family);
}

/* ---------------------------------------------------------------------------
   以下为 Button 组件样式，与 button.module.css 数值逐条一致（类名去掉了
   CSS Modules 的哈希）。§ 标记的行是本仓库建议值，不是官方数值。
   --------------------------------------------------------------------------- */
.button {
  --dsh-btn-height: 36px;
  --dsh-btn-pad-x: 14px;
  --dsh-btn-radius: 18px;
  --dsh-btn-font-size: 14px;
  --dsh-btn-line-height: 22px;
  --dsh-btn-gap: 4px;

  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--dsh-btn-gap);
  height: var(--dsh-btn-height);
  padding: 0 var(--dsh-btn-pad-x);
  border: 0;
  border-radius: var(--dsh-btn-radius);
  background: transparent;
  color: var(--dsw-alias-label-primary);
  font-family: inherit;
  font-size: var(--dsh-btn-font-size);
  line-height: var(--dsh-btn-line-height);
  white-space: nowrap;
  cursor: pointer;
}
.button:disabled { cursor: not-allowed; opacity: 0.4; }
/* § 本仓库建议值：官方 Button 未定义焦点样式 */
.button:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }

.sm {
  --dsh-btn-height: 28px;
  --dsh-btn-pad-x: 10px;
  --dsh-btn-radius: 14px;
  --dsh-btn-font-size: 12px;
  --dsh-btn-line-height: 18px;
}
/* § 高度取官方注释的 Icon_container 28×28；width/padding 为本仓库建议值 */
.icon-only { --dsh-btn-pad-x: 0; width: var(--dsh-btn-height); padding: 0; }

.primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
.primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }
.ghost:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.ghost:active:not(:disabled) { background: var(--dsw-alias-interactive-bg-active); }
.outline { border: 0.5px solid var(--dsw-alias-border-l3); }
.outline:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.toolbar { background: var(--dsw-alias-button-tool-bar-fill); }
.toolbar:hover:not(:disabled) { background: var(--dsw-alias-button-tool-bar-hover); }

.icon {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
}

/* ------------------------------------------------------------------ demo 外壳 */
body {
  margin: 0;
  padding: 32px;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font: var(--dsw-font-s-14);
}
h1 { font-size: 18px; line-height: 26px; font-weight: 600; margin: 0 0 4px; }
p.lead { margin: 0 0 24px; color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xs-13); }
h2 { font-size: 13px; line-height: 20px; font-weight: 600; color: var(--dsw-alias-label-tertiary); margin: 24px 0 8px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar-strip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: 12px;
  background: var(--dsw-alias-bg-module-platform);
}
.hint { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xs-13); }
</style>
</head>
<body>
  <h1>Button 按钮</h1>
  <p class="lead">几何来自官方 Button.module.css（h36 / pad 0 14px / gap 4px / r18；sm h28 / 12-18 / pad 0 10px / r14）。实现为本仓库原创。</p>

  <h2>四变体 · md（36px）</h2>
  <div class="row">
    <button type="button" class="button primary">主要操作</button>
    <button type="button" class="button ghost">次要操作</button>
    <button type="button" class="button outline">取消</button>
    <button type="button" class="button toolbar">工具条</button>
  </div>

  <h2>四变体 · sm（28px）</h2>
  <div class="row">
    <button type="button" class="button primary sm">保存</button>
    <button type="button" class="button ghost sm">重试</button>
    <button type="button" class="button outline sm">取消</button>
    <button type="button" class="button toolbar sm">设置</button>
  </div>

  <h2>带图标（图标容器 16×16）</h2>
  <div class="row">
    <button type="button" class="button primary">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.2 1.6h1.6v5.6h5.6v1.6H8.8v5.6H7.2V8.8H1.6V7.2h5.6V1.6z" fill="currentColor"/></svg></span>
      新建会话
    </button>
    <button type="button" class="button ghost sm">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6a6.4 6.4 0 1 0 0 12.8A6.4 6.4 0 0 0 8 1.6zm0 1.6a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6z" fill="currentColor"/></svg></span>
      刷新
    </button>
  </div>

  <h2>仅图标按钮（sm 高度 28px，正方形，需 aria-label）</h2>
  <div class="row">
    <button type="button" class="button ghost sm icon-only" aria-label="更多操作">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg></span>
    </button>
    <button type="button" class="button toolbar sm icon-only" aria-label="关闭">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.4 8 6.9l4.5-4.5 1.1 1.1L9.1 8l4.5 4.5-1.1 1.1L8 9.1l-4.5 4.5-1.1-1.1L6.9 8 2.4 3.5z" fill="currentColor"/></svg></span>
    </button>
  </div>

  <h2>禁用（opacity 0.4）</h2>
  <div class="row">
    <button type="button" class="button primary" disabled>主要操作</button>
    <button type="button" class="button outline" disabled>取消</button>
  </div>

  <h2>放进工具条</h2>
  <div class="toolbar-strip">
    <button type="button" class="button toolbar sm icon-only" aria-label="添加">+</button>
    <button type="button" class="button toolbar sm">筛选</button>
    <button type="button" class="button toolbar sm">排序</button>
  </div>

  <p class="hint" style="margin-top:24px">提示：把鼠标移到按钮上看 hover 底色；Tab 键可以看到焦点环（§ 本仓库建议值）。</p>
</body>
</html>
