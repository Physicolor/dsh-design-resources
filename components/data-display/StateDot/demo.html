  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, .04), 0 0 20px 0 rgba(0, 0, 0, .05);

  --dsw-font-s-14: 14px/22px var(--dsw-font-family);
  --dsw-font-xs-13: 13px/20px var(--dsw-font-family);

/* Dark theme: the site hangs the dark tokens on body[data-ds-dark-theme], which a Shadow DOM
   cannot select, and :host's own custom properties would override the inherited values — so the
   dark values are carried in this file and chosen with light-dark() from the color-scheme the host
   inherits. Only the tokens this page uses whose light and dark values differ; every value comes
   from website/css/dsh-tokens.css. */
:root {
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
  --dsw-alias-state-error-primary: light-dark(var(--dsw-static-red-600), var(--dsw-static-red-400));
}

/* --------------------------------------------------- component geometry
   Every value comes from state-dot.module.css in this directory (the CSS Modules hashed class names
   are removed); the rules are re-organised, the declared values are unchanged. */
.dot,
.matrix { --dsh-statedot-ongoing: var(--dsw-static-deepseek-450); flex: none; }

.dot { position: relative; display: inline-block; }

.dot::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  corner-shape: round;
  background: currentColor;
  opacity: 0.1;
}

.dot::after {
  content: '';
  position: absolute;
  inset: 20%;
  border-radius: 50%;
  corner-shape: round;
  background: currentColor;
}

.dot[data-state='done'] { color: var(--dsw-alias-state-success-primary); }
.dot[data-state='warning'] { color: var(--dsw-alias-state-warn-primary); }
.dot[data-state='error'] { color: var(--dsw-alias-state-error-primary); }
.dot[data-state='idle'] { color: var(--dsw-alias-label-tertiary); }

.matrix { color: var(--dsh-statedot-ongoing); }

.cell {
  fill: currentColor;
  opacity: 0.15;
  animation: dsh-design-state-dot-chase 1s infinite;
}

@keyframes dsh-design-state-dot-chase {
  0%, 12.4% { opacity: 1; }
  12.5%, 24.9% { opacity: 0.6; }
  25%, 37.4% { opacity: 0.35; }
  37.5%, 100% { opacity: 0.15; }
}

/* § value proposed by this repository: stop the chase when motion is reduced; the 8 cells rest at
   the middle step, 0.6 */
@media (prefers-reduced-motion: reduce) {
  .cell { animation: none; opacity: 0.6; }
}

/* ------------------------------------------------------------------ demo shell
   body gets only a 16px padding and the text colour, no background: the surface comes from the
   site (the shadow host). .demo-label is the only text this page allows, and it states observable
   facts only (sizes / state names). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}

.provider { display: inline-flex; align-items: center; gap: 6px; }
.provider-name { font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-primary); }
</style>
</head>
<body>
