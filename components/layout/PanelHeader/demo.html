/* Dark theme: the site hangs its dark tokens on body[data-ds-dark-theme], which a shadow DOM
   cannot select, and :host custom properties would override the inherited values — so the dark
   values are carried in this file and chosen with light-dark() from the color-scheme the host
   inherits. Only tokens this page uses whose light and dark values differ are listed; every
   value comes from website/css/dsh-tokens.css. */
:root {
  --dsw-alias-border-l1: light-dark(#0000000a, #ffffff0f);
  --dsw-alias-brand-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-button-primary-hover: light-dark(var(--dsw-static-neutral-bluish-750), var(--dsw-static-neutral-bluish-100));
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-primary-foreground: light-dark(var(--dsw-static-neutral-bluish-00), var(--dsw-static-neutral-bluish-1000));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
}

/* --------------------------------------------------- component geometry
   Every value comes from panelheader.module.css in this directory (the CSS Modules hashed
   class names are dropped); the rules are reorganised, the declared values are unchanged. */
.header {
  --dsh-ph-height: 44px;
  --dsh-ph-pad-x: 12px;
  --dsh-ph-gap: 8px;
  --dsh-ph-title-size: 14px;
  --dsh-ph-title-line: 22px;

  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--dsh-ph-gap);
  min-height: var(--dsh-ph-height);
  padding: 0 var(--dsh-ph-pad-x);
  font-family: inherit;
}

/* Bottom hairline: the official Menu.module.css .separator treatment (0.5px + border-l1). */
.divider { box-shadow: inset 0 -0.5px 0 0 var(--dsw-alias-border-l1); }

.heading { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }

.title {
  overflow: hidden;
  font-size: var(--dsh-ph-title-size);
  font-weight: 500;
  line-height: var(--dsh-ph-title-line);
  color: var(--dsw-alias-label-primary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.description {
  overflow: hidden;
  font-size: 12px;
  line-height: 18px;
  color: var(--dsw-alias-label-tertiary);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.actions { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }

.sm { --dsh-ph-height: 36px; --dsh-ph-pad-x: 8px; }

/* The two rules below are the Button component's geometry, matching controls/Button/button.module.css rule for rule. */
.button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: var(--dsw-alias-label-primary);
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
  white-space: nowrap;
  cursor: pointer;
}

.button.sm { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; line-height: 18px; }

.button.icon-only { padding: 0; width: 36px; }
.button.sm.icon-only { padding: 0; width: 28px; }

.button.primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
.button.primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }
.button.ghost:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.button.toolbar { background: var(--dsw-alias-button-tool-bar-fill); }
.button.toolbar:hover:not(:disabled) { background: var(--dsw-alias-button-tool-bar-hover); }
.button:disabled { cursor: not-allowed; opacity: 0.4; }
.button:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }
.button > svg { flex: none; }

/* ------------------------------------------------------------------ demo shell
   body sets only the 16px padding and the text colour, never a background: the site (the shadow
   host) supplies that. .demo-label is the only text this page allows, and it states facts only
   (sizes and state names). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}
