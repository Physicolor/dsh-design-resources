/* Dark theme: the site hangs its dark tokens on body[data-ds-dark-theme], which a shadow DOM
   cannot select, and :host custom properties would override the inherited values — so the dark
   values are carried in this file and chosen with light-dark() from the color-scheme the host
   inherits. Only tokens this page uses whose light and dark values differ are listed; every
   value comes from website/css/dsh-tokens.css. */
:root {
  --dsw-alias-brand-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-interactive-bg-active: light-dark(#2631481a, #ffffff24);
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
}

/* --------------------------------------------------- component geometry
   Every value comes from sidebarrow.module.css in this directory (the CSS Modules hashed
   class names are dropped); the rules are reorganised, the declared values are unchanged. */
.row {
  --dsh-sb-min-height: 40px;
  --dsh-sb-pad-x: 10px;
  --dsh-sb-pad-y: 8px;
  --dsh-sb-gap: 8px;
  --dsh-sb-radius: 10px;

  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--dsh-sb-gap);
  width: 100%;
  min-height: var(--dsh-sb-min-height);
  min-width: 0;
  padding: var(--dsh-sb-pad-y) var(--dsh-sb-pad-x);
  border: none;
  border-radius: var(--dsh-sb-radius);
  background: transparent;
  color: var(--dsw-alias-label-primary);
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
  text-align: left;
  cursor: pointer;
}

.row:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.row:active:not(:disabled) { background: var(--dsw-alias-interactive-bg-active); }
.row:disabled { cursor: not-allowed; opacity: 0.4; }
.row:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: -2px; }

.selectedFill { background: var(--dsw-alias-interactive-bg-hover); }
.selectedFill:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-active); }

.leading {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--dsw-alias-label-tertiary);
}

.label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.trailing { flex: none; color: var(--dsw-alias-label-tertiary); font-size: 12px; line-height: 18px; }

.check {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--dsw-alias-label-primary);
}

/* Proposed value: 16×16 + accent-color, aligned with the official RiskConfirmation .acknowledgement input. */
.checkbox {
  flex: none;
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--dsw-alias-button-primary-fill);
  cursor: pointer;
}

/* ------------------------------------------------------------------ demo shell
   body sets only the 16px padding and the text colour, never a background: the site (the shadow
   host) supplies that. .demo-label is the only text this page allows, and it states facts only
   (sizes and state names). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}
</style>
