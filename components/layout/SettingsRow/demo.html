/* Dark theme: the site hangs its dark tokens on body[data-ds-dark-theme], which a shadow DOM
   cannot select, and :host custom properties would override the inherited values — so the dark
   values are carried in this file and chosen with light-dark() from the color-scheme the host
   inherits. Only tokens this page uses whose light and dark values differ are listed; every
   value comes from website/css/dsh-tokens.css. */
:root {
  --dsw-alias-bg-layer-1: light-dark(var(--dsw-static-neutral-bluish-00), var(--dsw-static-neutral-bluish-875));
  --dsw-alias-border-l2: light-dark(#0000001a, #ffffff1f);
  --dsw-alias-border-l3: light-dark(#0000001f, #ffffff29);
  --dsw-alias-border-l4: light-dark(#00000029, #fff3);
  --dsw-alias-brand-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-dimmed: light-dark(var(--dsw-static-neutral-bluish-200), var(--dsw-static-neutral-bluish-750));
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-primary-foreground: light-dark(var(--dsw-static-neutral-bluish-00), var(--dsw-static-neutral-bluish-1000));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
}

/* --------------------------------------------------- component geometry
   Every value comes from settingsrow.module.css in this directory (the CSS Modules hashed
   class names are dropped); the rules are reorganised, the declared values are unchanged. */
.row {
  --dsh-sr-min-height: 44px;
  --dsh-sr-pad-y: 12px;
  --dsh-sr-pad-x: 12px;
  --dsh-sr-gap: 12px;

  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--dsh-sr-gap);
  min-height: var(--dsh-sr-min-height);
  padding: var(--dsh-sr-pad-y) var(--dsh-sr-pad-x);
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}

/* Row separator: the official Menu.module.css .footer 0.5px + border-l2. */
.divider { box-shadow: inset 0 -0.5px 0 0 var(--dsw-alias-border-l2); }

.text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.title { font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-primary); }

.description {
  font-size: var(--dsh-sr-desc-size, 13px);
  line-height: var(--dsh-sr-desc-line, 20px);
  color: var(--dsw-alias-label-tertiary);
}

@supports (font: var(--dsw-font-xs-13)) {
  .description { font: var(--dsw-font-xs-13); }
}

.control { flex: none; display: flex; align-items: center; gap: 8px; }

.row:hover { background: var(--dsw-alias-interactive-bg-hover); }

/* The Switch component's geometry, matching controls/Switch/switch.module.css rule for rule. */
.switch {
  box-sizing: border-box;
  position: relative;
  flex: 0 0 auto;
  width: 36px;
  height: 20px;
  padding: 2px;
  border: 0;
  border-radius: 10px;
  corner-shape: round;
  background: var(--dsw-alias-border-l3);
  cursor: pointer;
}

.switch[aria-checked='true'] { background: var(--dsw-alias-brand-primary); }
.switch:disabled { cursor: default; opacity: 0.5; }
.switch:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }

.switch .thumb {
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  corner-shape: round;
  background: var(--dsw-alias-label-primary-foreground);
  transition: transform 120ms ease;
}

.switch[aria-checked='true'] .thumb { transform: translateX(16px); }

/* The Input component's geometry, matching controls/Input/input.module.css rule for rule. */
.input-wrap {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 8px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: 8px;
  background: var(--dsw-alias-bg-layer-1);
}

.input-wrap:focus-within { border-color: var(--dsw-alias-brand-primary); }

.input-field {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
  color: var(--dsw-alias-label-primary);
}

.input-field::placeholder { color: var(--dsw-alias-label-dimmed); }

/* ------------------------------------------------------------------ demo shell
   body sets only the 16px padding and the text colour, never a background: the site (the shadow
   host) supplies that. .demo-label is the only text this page allows, and it states facts only
   (sizes and state names). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}
.row-anatomy{display:grid;grid-template-columns:minmax(170px,220px) minmax(380px,560px);gap:20px;align-items:start;justify-content:center}
.row-legend{color:var(--dsw-alias-label-secondary);font-size:12px;line-height:18px}
.row-legend h3{margin:0 0 8px;color:var(--dsw-alias-label-primary);font-size:14px;line-height:22px}
.row-legend ol{margin:0;padding-left:18px}
.row-legend li+li{margin-top:8px}
.row-list{min-width:0}
.row-list>.title{margin:0 0 10px;font-weight:600}
@media(max-width:760px){.row-anatomy{grid-template-columns:minmax(0,1fr)}}</style>
