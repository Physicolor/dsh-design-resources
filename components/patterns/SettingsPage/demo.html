  --dsw-static-neutral-bluish-75: #f1f3f5;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-150: #e9ecf2;
  --dsw-static-neutral-bluish-200: #e1e5ee;
  --dsw-static-neutral-bluish-300: #cfd3d6;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-500: #979da6;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-750: #43454a;
  --dsw-static-neutral-bluish-800: #353638;
  --dsw-static-neutral-bluish-850: #2c2c2e;
  --dsw-static-neutral-bluish-875: #232324;
  --dsw-static-neutral-bluish-900: #1b1b1c;
  --dsw-static-neutral-bluish-950: #151517;
  --dsw-static-neutral-bluish-1000: #0f1115;
  --dsw-static-neutral-50: #fafafa;
  --dsw-static-neutral-200: #e5e5e5;
  --dsw-static-neutral-300: #d4d4d4;
  --dsw-static-deepseek-100: #e4edfd;
  --dsw-static-deepseek-400: #7aaaff;
  --dsw-static-deepseek-450: #5686fe;
  --dsw-static-deepseek-500: #4176e6;
  --dsw-static-deepseek-800: #34415b;
  --dsw-static-green-100: #e6faed;
  --dsw-static-green-400: #4ed17e;
  --dsw-static-green-500: #22c55e;
  --dsw-static-green-900: #233c2c;
  --dsw-static-amber-100: #fef5e7;
  --dsw-static-amber-400: #f7ad31;
  --dsw-static-amber-500: #f59e0b;
  --dsw-static-amber-600: #dd8629;
  --dsw-static-amber-900: #27241f;
  --dsw-static-red-100: #fee2e2;
  --dsw-static-red-400: #f25a5a;
  --dsw-static-red-600: #ec1313;
  --dsw-static-blue-500: #3b82f6;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-mask-1: #0000003d;
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-bg-skeleton: #0000000a;
  --dsw-alias-border-l1: #0000000a;
  --dsw-alias-border-l2: #0000001a;
  --dsw-alias-border-l3: #0000001f;
  --dsw-alias-border-l4: #00000029;
  --dsw-alias-brand-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-button-contrast-fill: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-button-elevated-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-fill: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-button-floating-hover: var(--dsw-static-neutral-bluish-75);
  --dsw-alias-button-ghost-active-border: var(--dsw-static-neutral-bluish-500);
  --dsw-alias-button-ghost-active-fill: var(--dsw-static-neutral-bluish-100);
  --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary);
  --dsw-alias-button-primary-hover: var(--dsw-static-neutral-bluish-750);
  --dsw-alias-button-tool-bar-fill: #54555780;
  --dsw-alias-button-tool-bar-hover: #54555799;
  --dsw-alias-interactive-bg-active: #2631481a;
  --dsw-alias-interactive-bg-hover: #2631480f;
  --dsw-alias-interactive-bg-hover-danger: #ec13130d;
  --dsw-alias-label-caption: var(--dsw-static-neutral-bluish-400);
  --dsw-alias-label-dimmed: var(--dsw-static-neutral-bluish-200);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-primary-inverted: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-600);
  --dsw-alias-link: var(--dsw-static-deepseek-500);
  --dsw-alias-markdown-code-block: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-code-block-banner: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-markdown-inline-code: var(--dsw-static-neutral-50);
  --dsw-alias-scrollbar-bg-l2: var(--dsw-static-neutral-200);
  --dsw-alias-scrollbar-hover-l2: var(--dsw-static-neutral-300);
  --dsw-alias-specific-menu: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-specific-sidebar-fill: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-state-business-primary: var(--dsw-static-deepseek-500);
  --dsw-alias-state-error-primary: var(--dsw-static-red-600);
  --dsw-alias-state-success-primary: var(--dsw-static-green-500);
  --dsw-alias-state-success-tertiary: var(--dsw-static-green-100);
  --dsw-alias-state-warn-label: var(--dsw-static-amber-600);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-100);
  --dsw-alias-tooltip-bg: var(--dsw-static-neutral-bluish-850);
  --dsw-specific-menu: var(--dsw-static-neutral-bluish-50);

  --dsw-elevation-stroke-color: var(--dsw-alias-border-l1);
  --dsw-elevation-stroke: 0 0 0 .5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, .04), 0 0 20px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv1: 0 2px 4px 0 rgba(0, 0, 0, .05);
  --dsw-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, .02), 0 2px 8px 0 rgba(0, 0, 0, .04);
  --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, .2), 0 0 4px 0 rgba(0, 0, 0, .02), 0 12px 32px 0 rgba(0, 0, 0, .08);
  --dsw-mask-blur: none;
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  /* 官方把这两条写成 font 简写合成 token，这里展开以便 demo 单条使用。 */
  --dsw-font-s-14: 14px/22px var(--dsw-font-family);
  --dsw-font-xs-13: 13px/20px var(--dsw-font-family);
}

/* 深色主题：站点把深色 token 挂在 body[data-ds-dark-theme] 上，Shadow DOM 里选择不到它，
   而 :host 自己的自定义属性又会盖过继承值——所以深色值在文件内自带一份，用 light-dark()
   依据宿主继承下来的 color-scheme 选择。只列本页用到、且深浅两套取值不同的 token；
   数值逐条取自 website/css/dsh-tokens.css。 */
:root {
  --dsw-alias-bg-module-platform: light-dark(var(--dsw-static-neutral-bluish-60), var(--dsw-static-neutral-bluish-800));
  --dsw-alias-brand-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-button-primary-hover: light-dark(var(--dsw-static-neutral-bluish-750), var(--dsw-static-neutral-bluish-100));
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-primary-foreground: light-dark(var(--dsw-static-neutral-bluish-00), var(--dsw-static-neutral-bluish-1000));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
}

/* --------------------------------------------------- 组件几何
   数值逐条取自同目录 settings-page.module.css（CSS Modules 的哈希类名已去掉），
   规则重新组织过，声明值未改。 */
.page {
  --dsh-settings-nav-width: 218px;
  --dsh-settings-gap: 32px;
  --dsh-settings-pad: 24px;
  --dsh-settings-block-gap: 24px;
  --dsh-settings-radius: 12px;
  --dsh-settings-nav-pad: 4px;
  --dsh-settings-content-max: 640px;

  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  gap: var(--dsh-settings-gap);
  padding: var(--dsh-settings-pad);
  color: var(--dsw-alias-label-primary);
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
}

.nav {
  flex: none;
  box-sizing: border-box;
  width: var(--dsh-settings-nav-width);
  padding: var(--dsh-settings-nav-pad);
  border-radius: var(--dsh-settings-radius);
  background: var(--dsw-alias-bg-module-platform);
}

.navInner { display: flex; flex-direction: column; gap: 0; }

/* 导航行：官方 Menu.module.css .item */
.navItem {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}

.navItem:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.navItemActive { color: var(--dsw-alias-label-primary); background: var(--dsw-alias-interactive-bg-hover); }
.navItem:disabled { opacity: 0.4; cursor: not-allowed; }
.navItem:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }

.navItemIcon {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  color: var(--dsw-alias-label-tertiary);
}

.navItemLabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.content { flex: 1; min-width: 0; max-width: var(--dsh-settings-content-max); }

.pageTitle { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--dsw-alias-label-primary); }
/* 组件默认 titleLevel=1；预览被嵌进站点（页面已有 h1）与自检规则里都不该再出现 h1，
   所以 demo 取 h2 —— .pageTitle 的字号/行高/字重不受标签影响，几何不变。 */
.pageDescription { margin: 4px 0 0; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-secondary); }
.contentBody { display: flex; flex-direction: column; gap: var(--dsh-settings-block-gap); margin-top: 20px; }

.section { display: flex; flex-direction: column; min-width: 0; }
.sectionHeader { display: flex; align-items: center; gap: 8px; }
.sectionTitle { margin: 0; font-size: 14px; line-height: 22px; font-weight: 500; color: var(--dsw-alias-label-primary); }
.sectionActions { display: flex; flex: none; align-items: center; gap: 8px; margin-left: auto; }
.sectionDescription { margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.sectionBody { margin-top: 8px; }

/* Button 组件的几何，逐条同 controls/Button/button.module.css。 */
.button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: var(--dsw-alias-label-primary);
  font-family: inherit;
  font-size: 14px;
  line-height: 22px;
  white-space: nowrap;
  cursor: pointer;
}

.button.sm { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; line-height: 18px; }
.button.ghost:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.button.primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
.button.primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }
.button:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 2px; }

/* ------------------------------------------------------------------ demo 外壳
   body 只给 16px 内边距与文字颜色，不设背景：底色由站点（shadow host）提供。
   .demo-label 是本页唯一允许出现的文字，只写客观事实（尺寸 / 状态名）。 */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
}
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.demo-stack, .stack { display: flex; flex-direction: column; }
.demo-canvas {
  padding: 12px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}
</style>
</head>
<body>
  <div class="demo-group">
    <p class="demo-label">导航列 218px · pad 4 r12 · 内容列 max 640 · 两列 gap 32 · 页面 pad 24</p>
    <div class="page" style="max-width:720px">
      <nav class="nav" aria-label="分区导航">
        <div class="navInner">
          <button type="button" class="navItem navItemActive" aria-current="page"><span class="navItemIcon"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6.9 1.6h2.2l.3 1.7 1.2.5 1.5-.9 1.6 1.6-.9 1.5.5 1.2 1.7.3v2.2l-1.7.3-.5 1.2.9 1.5-1.6 1.6-1.5-.9-1.2.5-.3 1.7H6.9l-.3-1.7-1.2-.5-1.5.9-1.6-1.6.9-1.5-.5-1.2L1 9.1V6.9l1.7-.3.5-1.2-.9-1.5 1.6-1.6 1.5.9 1.2-.5zM8 6.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z" fill="currentColor"/></svg></span><span class="navItemLabel">分区一</span></button>
          <button type="button" class="navItem"><span class="navItemIcon"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.6a6.4 6.4 0 0 0 0 12.8c.9 0 1.4-.6 1.4-1.2 0-.4-.2-.7-.4-1-.2-.2-.3-.5-.3-.8 0-.7.5-1.2 1.2-1.2h1.3A3.2 3.2 0 0 0 14.4 7C14.4 4 11.5 1.6 8 1.6zM4.6 8.4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm1.6-2.8a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3.2-.4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2.8 2.4a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="currentColor"/></svg></span><span class="navItemLabel">分区二</span></button>
          <button type="button" class="navItem"><span class="navItemIcon"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.6 3.2h4.4l1.2 1.6h7.2v8H1.6z" fill="currentColor"/></svg></span><span class="navItemLabel">分区三</span></button>
        </div>
      </nav>
      <div class="content">
        <h2 class="pageTitle">页面标题</h2>
        <p class="pageDescription">页面说明文字</p>
        <div class="contentBody">
          <section class="section" aria-labelledby="sec-a">
            <div class="sectionHeader">
              <h2 class="sectionTitle" id="sec-a">分区一</h2>
              <div class="sectionActions"><button type="button" class="button sm ghost">操作</button></div>
            </div>
            <p class="sectionDescription">分区说明文字</p>
            <div class="sectionBody" style="font-size:13px;line-height:20px;color:var(--dsw-alias-label-secondary)">条目一 · 条目二 · 条目三</div>
          </section>
          <section class="section" aria-labelledby="sec-b">
            <div class="sectionHeader"><h2 class="sectionTitle" id="sec-b">分区二</h2></div>
            <div class="sectionBody" style="font-size:13px;line-height:20px;color:var(--dsw-alias-label-secondary)">条目一 · 条目二 · 条目三</div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <div class="demo-group">
    <p class="demo-label">无 title / description · contentBody 直接开始 · gap 24</p>
    <div class="page" style="max-width:720px">
      <nav class="nav" aria-label="分区导航">
        <div class="navInner">
          <button type="button" class="navItem navItemActive" aria-current="page"><span class="navItemLabel">分区一</span></button>
        </div>
      </nav>
      <div class="content">
        <div class="contentBody" style="margin-top:0">
          <section class="section">
            <div class="sectionHeader"><h2 class="sectionTitle">分区一</h2></div>
            <div class="sectionBody" style="font-size:13px;line-height:20px;color:var(--dsw-alias-label-secondary)">只渲染内容列时的骨架</div>
          </section>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
