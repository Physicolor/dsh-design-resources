<!-- 几何取自同目录 running-ring.module.css（即产品采集值）；token 取自 website/css/dsh-tokens.css。
     环本身对读屏隐藏，行里那段「进行中」是视觉隐藏文本——用 Tab 走过这一页时读屏会念到它。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunningRing · DSH 设计资源</title>
<style>
:root {
  --dsw-static-neutral-bluish-00: #fff;
  --dsw-static-neutral-bluish-50: #f9fafb;
  --dsw-static-neutral-bluish-60: #f9fafb;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-200: #e1e5ee;
  --dsw-static-neutral-bluish-300: #cfd3d6;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-1000: #0f1115;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-border-l1: light-dark(#0000000a, #ffffff0f);
  --dsw-alias-border-l2: light-dark(#0000001a, #ffffff1f);
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* --------------------------------------------------- 组件几何
   数值逐条取自同目录 running-ring.module.css（CSS Modules 的哈希类名已去掉），
   规则重新组织过，声明值未改。 */
.root { display: inline-flex; align-items: center; flex: none; }
.ring { display: block; flex: none; color: var(--dsw-alias-label-tertiary); }
.motion { transform-origin: center; animation: dsh-design-running-ring-spin 1.5s linear infinite; }
.track, .arc { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.track { opacity: 0.25; }
.arc { stroke-dasharray: 12 150; animation: dsh-design-running-ring-dash 1.5s ease-in-out infinite; }
@keyframes dsh-design-running-ring-spin { to { transform: rotate(360deg); } }
@keyframes dsh-design-running-ring-dash {
  0% { stroke-dasharray: 12 150; stroke-dashoffset: 0; }
  50% { stroke-dasharray: 24 150; stroke-dashoffset: -6; }
  to { stroke-dasharray: 12 150; stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .motion, .arc { animation: none; }
  .arc { stroke-dasharray: 18 150; stroke-dashoffset: -3; }
}
.srOnly {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* 静止形态：把媒体查询里那一帧写成类，好在同一页里对照看。
   产品在「减少动效」下的真实表现就是这个样子，不是另一套设计。 */
.frozen .motion, .frozen .arc { animation: none; }
.frozen .arc { stroke-dasharray: 18 150; stroke-dashoffset: -3; }

/* ------------------------------------------------------------------ demo 外壳
   body 只给 16px 内边距与文字颜色，不设背景：底色由站点（shadow host）提供。
   .demo-label 只写客观事实（尺寸 / 出处）。 */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label { margin: 0 0 8px; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-tertiary); }
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; align-items: center; gap: 12px; }

/* 左栏会话行的实测排布：行高 32、行首座位的字形 14×14。仅用于说明这枚环长在哪儿。 */
.sessionRow {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 256px;
  height: 32px;
  padding: 0 8px 0 10px;
  border-radius: 8px;
  color: var(--dsw-alias-label-primary);
  background: transparent;
}
.sessionRow__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sessionRow__time { flex: none; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
.canvas {
  display: inline-flex;
  align-items: center;
  padding: 12px;
  border-radius: 8px;
  background: light-dark(#f7f7f9, #131315);
}
</style>
</head>
<body>
  <div class="demo-group">
    <p class="demo-label">默认 14px（左栏会话行首的实渲尺寸）· viewBox 24 · r 9.5 · stroke 2 · 1.5s 转 + 1.5s 伸缩</p>
    <div class="demo-row">
      <span class="canvas">
        <span class="root">
          <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="motion">
              <circle class="track" cx="12" cy="12" r="9.5"></circle>
              <circle class="arc" cx="12" cy="12" r="9.5"></circle>
            </g>
          </svg>
          <span class="srOnly">进行中</span>
        </span>
      </span>
      <span class="canvas frozen">
        <span class="root">
          <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="motion">
              <circle class="track" cx="12" cy="12" r="9.5"></circle>
              <circle class="arc" cx="12" cy="12" r="9.5"></circle>
            </g>
          </svg>
        </span>
      </span>
    </div>
    <p class="demo-label" style="margin-top:8px">左：运行中（1.5s 一圈）　右：减少动效下停住的那一帧（弧停在 18 150 / -3，仍是「没转完」）</p>
  </div>

  <div class="demo-group">
    <p class="demo-label">长在哪儿 · 左栏会话行（行 256 × 32，环替掉平时那枚会话字形）</p>
    <div class="sessionRow">
      <span class="root">
        <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g class="motion">
            <circle class="track" cx="12" cy="12" r="9.5"></circle>
            <circle class="arc" cx="12" cy="12" r="9.5"></circle>
          </g>
        </svg>
        <span class="srOnly">进行中</span>
      </span>
      <span class="sessionRow__title">示例会话：整理接口文档</span>
      <span class="sessionRow__time">2 分钟</span>
    </div>
  </div>
</body>
</html>
