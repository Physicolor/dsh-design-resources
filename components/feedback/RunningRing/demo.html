<!-- The geometry is taken from running-ring.module.css in the same directory (that is, the value
     collected from the product); the tokens are taken from website/css/dsh-tokens.css.
     The ring itself is hidden from screen readers, and the "in progress" text on the row is
     visually hidden copy — a screen reader reads it out when you tab through this page. -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t-title="demo.running-ring.pageTitle">RunningRing · DSH 设计资源</title>
<style>
:root {
  --dsw-static-neutral-bluish-00: #fff;
  --dsw-static-neutral-bluish-50: #f9fafb;
  --dsw-static-neutral-bluish-60: #f9fafb;
  --dsw-static-neutral-bluish-100: #ebeef2;
  --dsw-static-neutral-bluish-200: #e1e5ee;
  --dsw-static-neutral-bluish-300: #cfd3d6;
  --dsw-static-neutral-bluish-400: #adb2b8;
  --dsw-static-neutral-bluish-600: #81858c;
  --dsw-static-neutral-bluish-700: #61666b;
  --dsw-static-neutral-bluish-1000: #0f1115;

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-border-l1: light-dark(#0000000a, #ffffff0f);
  --dsw-alias-border-l2: light-dark(#0000001a, #ffffff1f);
  --dsw-alias-interactive-bg-hover: light-dark(#2631480f, #ffffff14);
  --dsw-alias-label-primary: light-dark(var(--dsw-static-neutral-bluish-1000), var(--dsw-static-neutral-bluish-50));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300));
  --dsw-alias-label-tertiary: light-dark(var(--dsw-static-neutral-bluish-600), var(--dsw-static-neutral-bluish-400));
  --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* --------------------------------------------------- component geometry
   Each value is taken from running-ring.module.css in the same directory (the CSS Modules
   hashed class names are removed); the rules are reorganised, the declared values are
   unchanged. */
.root { display: inline-flex; align-items: center; flex: none; }
.ring { display: block; flex: none; color: var(--dsw-alias-label-tertiary); }
.motion { transform-origin: center; animation: dsh-design-running-ring-spin 1.5s linear infinite; }
.track, .arc { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.track { opacity: 0.25; }
.arc { stroke-dasharray: 12 150; animation: dsh-design-running-ring-dash 1.5s ease-in-out infinite; }
@keyframes dsh-design-running-ring-spin { to { transform: rotate(360deg); } }
@keyframes dsh-design-running-ring-dash {
  0% { stroke-dasharray: 12 150; stroke-dashoffset: 0; }
  50% { stroke-dasharray: 24 150; stroke-dashoffset: -6; }
  to { stroke-dasharray: 12 150; stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .motion, .arc { animation: none; }
  .arc { stroke-dasharray: 18 150; stroke-dashoffset: -3; }
}
.srOnly {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* The still form: the frame from the media query written as a class, so the two can be
   compared side by side on one page. What the product really does under "reduce motion"
   looks exactly like this, not like a second design. */
.frozen .motion, .frozen .arc { animation: none; }
.frozen .arc { stroke-dasharray: 18 150; stroke-dashoffset: -3; }

/* ------------------------------------------------------------------ demo shell
   body only provides the 16px padding and the text colour, and sets no background: the
   backdrop comes from the site (the shadow host). .demo-label states objective facts only
   (sizes / where it comes from). */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsw-font-family);
  font-size: 14px;
  line-height: 22px;
}
.demo-label { margin: 0 0 8px; font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-tertiary); }
.demo-group + .demo-group { margin-top: 20px; }
.demo-row { display: flex; align-items: center; gap: 12px; }

/* The measured layout of a conversation row in the left sidebar: row height 32, the seat's
   glyph at the start of the row 14×14. It only shows where this ring sits. */
.sessionRow {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 256px;
  height: 32px;
  padding: 0 8px 0 10px;
  border-radius: 8px;
  color: var(--dsw-alias-label-primary);
  background: transparent;
}
.sessionRow__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sessionRow__time { flex: none; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
.canvas {
  display: inline-flex;
  align-items: center;
  padding: 12px;
  border-radius: 8px;
  background: light-dark(#f7f7f9, #131315);
}
</style>
</head>
<body>
  <div class="demo-group">
    <p class="demo-label" data-t="demo.running-ring.labelDefault">默认 14px（左栏会话行首的实渲尺寸）· viewBox 24 · r 9.5 · stroke 2 · 1.5s 转 + 1.5s 伸缩</p>
    <div class="demo-row">
      <span class="canvas">
        <span class="root">
          <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="motion">
              <circle class="track" cx="12" cy="12" r="9.5"></circle>
              <circle class="arc" cx="12" cy="12" r="9.5"></circle>
            </g>
          </svg>
          <span class="srOnly" data-capture="visually hidden running status, left sidebar conversation row">进行中</span>
        </span>
      </span>
      <span class="canvas frozen">
        <span class="root">
          <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g class="motion">
              <circle class="track" cx="12" cy="12" r="9.5"></circle>
              <circle class="arc" cx="12" cy="12" r="9.5"></circle>
            </g>
          </svg>
        </span>
      </span>
    </div>
    <p class="demo-label" style="margin-top:8px" data-t="demo.running-ring.labelFrozenSide">左：运行中（1.5s 一圈）　右：减少动效下停住的那一帧（弧停在 18 150 / -3，仍是「没转完」）</p>
  </div>

  <div class="demo-group">
    <p class="demo-label" data-t="demo.running-ring.labelWhereItSits">长在哪儿 · 左栏会话行（行 256 × 32，环替掉平时那枚会话字形）</p>
    <div class="sessionRow">
      <span class="root">
        <svg class="ring" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g class="motion">
            <circle class="track" cx="12" cy="12" r="9.5"></circle>
            <circle class="arc" cx="12" cy="12" r="9.5"></circle>
          </g>
        </svg>
        <span class="srOnly" data-capture="visually hidden running status, left sidebar conversation row">进行中</span>
      </span>
      <span class="sessionRow__title" data-t="demo.running-ring.sessionTitle">示例会话：整理接口文档</span>
      <span class="sessionRow__time" data-t="demo.running-ring.sessionTime">2 分钟</span>
    </div>
  </div>
</body>
</html>
