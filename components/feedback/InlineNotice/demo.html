/* Dark theme: the site hangs the dark tokens on body[data-ds-dark-theme], which cannot be
   selected inside a Shadow DOM, and :host's own custom properties would override the
   inherited values — so the dark values are carried inside the file and light-dark()
   picks between them from the color-scheme the host inherits. Only the tokens this page
   uses that differ between the light and dark sets are listed; each value is taken from
   website/css/dsh-tokens.css. */
:root {
  --dsw-alias-bg-module-platform: light-dark(var(--dsw-static-neutral-bluish-60), var(--dsw-static-neutral-bluish-800));
  --dsw-alias-label-secondary: light-dark(var(--dsw-static-neutral-bluish-700), var(--dsw-static-neutral-bluish-300));
  --dsw-alias-state-business-primary: light-dark(var(--dsw-static-deepseek-500), var(--dsw-static-deepseek-400));
  --dsw-alias-state-error-primary: light-dark(var(--dsw-static-red-600), var(--dsw-static-red-400));
  --dsw-alias-state-success-tertiary: light-dark(var(--dsw-static-green-100), var(--dsw-static-green-900));
  --dsw-alias-state-warn-tertiary: light-dark(var(--dsw-static-amber-100), var(--dsw-static-amber-900));
}

/* --------------------------------------------------- component geometry
   Each value is taken from inline-notice.module.css in the same directory (the CSS Modules
   hashed class names are removed); the rules are reorganised, the declared values are
   unchanged. */
.notice {
  --dsh-notice-text: var(--dsw-alias-label-secondary);
  --dsh-notice-bg: var(--dsw-alias-bg-module-platform);
  --dsh-notice-accent: var(--dsw-alias-state-business-primary);
  --dsh-notice-pad-y: 6px;
  --dsh-notice-dismiss-size: 20px;

  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 32px;
  padding: 0 10px;
  border: none;
  border-radius: 8px;
  background: var(--dsh-notice-bg);
  color: var(--dsh-notice-text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  text-align: left;
  white-space: nowrap;
  transition: background-color 160ms ease-out, color 160ms ease-out;
}

.notice:focus-visible { outline: 2px solid var(--dsh-notice-accent); outline-offset: 2px; }

.actionable { cursor: pointer; }
.actionable:active { background: color-mix(in srgb, var(--dsh-notice-bg), var(--dsh-notice-accent) 10%); }
.actionable:focus-visible .dismiss,
.actionable:hover .dismiss { opacity: 1; }

/* § values proposed by this repository: the multiline form */
.multiline {
  height: auto;
  min-height: 32px;
  align-items: flex-start;
  padding: var(--dsh-notice-pad-y) 10px;
  white-space: normal;
}

.multiline .icon { margin-top: 2px; }

.icon { display: grid; place-items: center; flex: none; width: 14px; height: 14px; color: var(--dsh-notice-accent); }

.text { min-width: 0; overflow-wrap: break-word; }

/* § values proposed by this repository: the dismiss control */
.dismiss {
  display: grid;
  place-items: center;
  flex: none;
  width: var(--dsh-notice-dismiss-size);
  height: var(--dsh-notice-dismiss-size);
  margin: 0 -4px 0 2px;
  border-radius: 6px;
  color: currentColor;
  cursor: pointer;
  opacity: 0.75;
}

.dismiss:hover { background: color-mix(in srgb, currentColor 12%, transparent); opacity: 1; }
.dismiss:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; opacity: 1; }

.warn { --dsh-notice-bg: var(--dsw-alias-state-warn-tertiary); --dsh-notice-text: var(--dsw-alias-state-warn-label); --dsh-notice-accent: var(--dsw-alias-state-warn-label); }
.success { --dsh-notice-bg: var(--dsw-alias-state-success-tertiary); --dsh-notice-text: var(--dsw-alias-state-success-primary); --dsh-notice-accent: var(--dsw-alias-state-success-primary); }
.info { --dsh-notice-bg: color-mix(in srgb, var(--dsw-alias-state-business-primary) 10%, transparent); --dsh-notice-text: var(--dsw-alias-state-business-primary); --dsh-notice-accent: var(--dsw-alias-state-business-primary); }
.error { --dsh-notice-bg: color-mix(in srgb, var(--dsw-alias-state-error-primary) 10%, transparent); --dsh-notice-text: var(--dsw-alias-state-error-primary); --dsh-notice-accent: var(--dsw-alias-state-error-primary); }

@media (prefers-reduced-motion: reduce) {
  .notice { transition: none; }
}

.demo-canvas {

  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
