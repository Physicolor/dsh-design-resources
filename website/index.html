<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Design Resources — DeepSeek Harness 界面规范与资源</title>
    <meta name="description" content="DeepSeek Harness 插件生态的设计规范、座位目录、官方 token、图标集与可直接复用的源码知识库。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="assets/fish.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/dsh-tokens.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/">
            <img class="brand__mark" src="assets/fish.svg" alt="DeepSeek">
            <span class="brand__name">DeepSeek Harness</span>
            <span class="brand__divider"></span>
            <span class="brand__product">设计资源</span>
        </a>
        <nav class="topbar__nav" id="topnav">
            <a href="#/spec">规范</a>
            <a href="#/components">组件</a>
            <a href="#/seats">座位</a>
            <a href="#/icons">图标</a>
            <a href="#/tokens">令牌</a>
        </nav>
        <span class="topbar__spacer"></span>
        <div class="search">
            <svg class="search__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M10.8 10.8L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input id="q" type="search" placeholder="搜索组件、座位、规范、图标…" autocomplete="off" aria-label="搜索">
        </div>
        <button class="icon-button" id="theme" type="button" title="切换浅色 / 深色" aria-label="切换主题">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/>
            </svg>
        </button>
    </header>

    <div class="shell">
        <nav class="index" id="index" aria-label="资源导航"></nav>
        <main class="main" id="main" tabindex="-1"></main>
        <aside class="aside" id="aside" aria-label="说明"></aside>
    </div>

    <div class="results" id="results" role="listbox" aria-label="搜索结果">
        <div class="results__panel" id="resultsPanel"></div>
    </div>

    <footer class="footer">
        <span>DeepSeek Design Resources</span>
        <span>规范与数据取自运行中的 DeepSeek Harness，逐条标注来源</span>
        <span id="stamp"></span>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
