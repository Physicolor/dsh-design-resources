<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Design Resources — DeepSeek Harness 界面规范与资源</title>
    <meta name="description" content="DeepSeek Harness 插件生态的设计规范、座位目录、官方 token、图标集与可直接复用的源码知识库。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="assets/fish.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/dsh-tokens.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/">
            <img class="brand__mark" src="assets/fish.svg" alt="DeepSeek">
            <span class="brand__name">DeepSeek Harness</span>
            <span class="brand__divider"></span>
            <span class="brand__product" data-t="brand.product">设计资源</span>
        </a>

        <button class="icon-button" id="navToggle" type="button" aria-pressed="true"
                title="显示或隐藏导航栏" aria-label="显示或隐藏导航栏">
            <span data-icon="panel-left"></span>
        </button>

        <nav class="topbar__nav" id="topnav" aria-label="快捷入口"></nav>

        <span class="topbar__spacer"></span>

        <div class="search">
            <span class="search__icon" data-icon="search"></span>
            <input id="q" type="search" autocomplete="off" aria-label="搜索" placeholder="搜索组件、座位、规范、图标…">
            <span class="search__hint" id="searchHint">Ctrl K</span>
        </div>

        <div class="segmented" id="lang" role="tablist" aria-label="语言"></div>

        <button class="icon-button" id="theme" type="button" title="切换浅色 / 深色" aria-label="切换浅色 / 深色">
            <span id="themeIcon"></span>
        </button>

        <button class="icon-button" id="asideToggle" type="button" aria-pressed="true"
                title="显示或隐藏说明栏" aria-label="显示或隐藏说明栏">
            <span data-icon="panel-right"></span>
        </button>
    </header>

    <div class="shell" id="shell">
        <div class="col col--nav" id="colNav">
            <nav class="col__scroll" id="index" aria-label="资源导航"></nav>
            <div class="resizer" data-resize="nav" role="separator" aria-orientation="vertical"
                 tabindex="0" aria-label="调整导航栏宽度"></div>
        </div>

        <main class="col col--main">
            <div class="col__scroll" id="main" tabindex="-1"></div>
        </main>

        <aside class="col col--aside" id="colAside">
            <div class="resizer" data-resize="aside" role="separator" aria-orientation="vertical"
                 tabindex="0" aria-label="调整说明栏宽度"></div>
            <div class="col__scroll" id="aside" aria-label="说明"></div>
        </aside>
    </div>

    <div class="results" id="results" role="listbox" aria-label="搜索结果">
        <div class="results__panel" id="resultsPanel"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
