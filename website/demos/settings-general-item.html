<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; color: var(--dsw-alias-label-primary); font: 14px/22px var(--dsw-font-family); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%; min-height: 76px; padding: 16px 0; border-bottom: .5px solid var(--dsw-alias-border-l2); }
.setting-copy { min-width: 0; }
.setting-title { font-size: 14px; line-height: 22px; font-weight: 500; }
.setting-description { margin: 2px 0 0; color: var(--dsw-alias-label-tertiary); font-size: 12px; line-height: 18px; }
.switch { position: relative; flex: none; width: 36px; height: 20px; padding: 2px; border: 0; border-radius: 999px; background: var(--dsw-alias-brand-primary); }
.switch::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
</style>
<div class="setting-row">
  <div class="setting-copy">
    <div class="setting-title" data-capture="General settings row title, 03-settings-open capture">显示代码工作视图</div>
    <p class="setting-description" data-capture="General settings row description, 03-settings-open capture">开启后，显示轨迹、本轮代码差异，可选择完整的 Agent 预设切换</p>
  </div>
  <button type="button" class="switch" role="switch" aria-checked="true" aria-label="Show the code workspace view" data-t-aria="demo.settings-general-item.showCodeWorkspaceView"></button>
</div>
